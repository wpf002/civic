name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://civic:civic@localhost:5432/civic
      # Tests assert the admin routes refuse the placeholder token, so give CI a real one.
      ADMIN_TOKEN: ci-admin-token
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civic
          POSTGRES_PASSWORD: civic
          POSTGRES_DB: civic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @civic/db exec prisma migrate deploy
      # The API, ingest and extract suites assert against the fixture, so it has to exist.
      - run: pnpm db:seed
      - run: pnpm --filter @civic/db seed:fixture
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
